<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login. | Schulclub SVG Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" >
    <link href="src/main.css" type="text/css" rel="stylesheet" >
</head>
<body>

<div class="hero bg-base-200 min-h-screen">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Please log in.</h1>
      <p class="py-6">
        This website is safed by a password. Please enter your password or use the <button class="btn btn-sm" onclick="demo_login();">Demo Login</button>.
      </p>
    </div>
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label">Username</label>
          <input type="text" class="input" placeholder="Username" id="username" />
          <label class="label">Password</label>
          <input type="password" class="input" placeholder="Password" id="password" />
          <div><button class="link link-hover" onclick='show_lgstatus("Forgot your Password?", "Please message an admin to reset your password or use the demo-login.");'>Forgot password?</button></div>
          <button class="btn btn-neutral mt-4">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>

<!-- Open the modal using ID.showModal() method -->
<!-- login_status.showModal() -->
<dialog id="login_status" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold" id="lgstatus_title">Loading...</h3>
    <p class="py-4" id="lgstatus_text">Loading...</p>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>Got it, close</button>
  </form>
</dialog>

<script>
    const usernameField = document.getElementById("username");
    const passwordField = document.getElementById("password");
    const lgstatus = document.getElementById("login_status");
    const lgstatus_text = document.getElementById("lgstatus_text");
    const lgstatus_title = document.getElementById("lgstatus_title");
    
    function demo_login() {
        usernameField.value = "Demo";
        passwordField.value = "DemoPassword-123";
        show_lgstatus("Successful", "Your temporary demo-login is now able to be opened.");
    }

    function show_lgstatus(title, text) {
        lgstatus_text.innerText = text;
        lgstatus_title.innerText = title;
        lgstatus.showModal();
    }
</script>
  
</body>
</html>
